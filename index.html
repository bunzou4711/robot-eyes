<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- この画面は「ロボットの顔」そのものなので、常に真っ黒が正解。darkのみ宣言する。 -->
    <meta name="color-scheme" content="dark" />
    <!-- ホーム画面から全画面（スタンドアロン）で開くための宣言 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ロボット" />
    <link rel="icon" href="data:," />
    <title>ロボットの目</title>
    <style>
      button { min-height: 2.75rem; }

      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: #000;
        color: #fff;
        font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
      }

      /* ===== 顔 ===== */
      .stage {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        cursor: pointer;
      }
      /* 画面回転：ビューワーが縦固定でも、表示全体を90°ずつ回して横置きに合わせる */
      .rotator {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        transform: translate(-50%, -50%) rotate(var(--rot, 0deg));
        transition: transform .45s cubic-bezier(.34, 1.2, .5, 1);
      }
      .rotator[data-rot="90"], .rotator[data-rot="270"] {
        width: 100vh;
        width: 100dvh;
        height: 100vw;
      }
      .face {
        position: relative;
        display: flex;
        align-items: center;
        gap: 15vmin;
        transition: transform .38s cubic-bezier(.34, 1.3, .5, 1);
        will-change: transform;
      }
      .face.bounce { animation: bounce .55s ease; }
      @keyframes bounce {
        0% { margin-top: 0; }
        35% { margin-top: -3.2vmin; }
        70% { margin-top: .8vmin; }
        100% { margin-top: 0; }
      }

      .eye {
        position: relative;
        width: 19vmin;
        height: 26vmin;
        border-radius: 42% / 46%;
        background: var(--eye-color, #f4f7f7);
        box-shadow: 0 0 6vmin 0 var(--eye-glow, rgba(190, 240, 255, .28));
        transition:
          height .45s cubic-bezier(.4, 0, .3, 1),
          width .45s cubic-bezier(.4, 0, .3, 1),
          border-radius .45s cubic-bezier(.4, 0, .3, 1),
          background-color .3s ease,
          transform .07s ease-in;
        flex: none;
      }
      .eye .heart {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        opacity: 0;
        transform: scale(.4);
        transition: opacity .25s ease, transform .35s cubic-bezier(.34, 1.6, .5, 1);
      }
      .eye .heart svg { width: 88%; height: 88%; }
      .eye .heart path { fill: var(--eye-color, #f4f7f7); }

      /* 色バリエーション */
      .face[data-color="white"] { --eye-color: #f4f7f7; --eye-glow: rgba(200, 235, 255, .30); }
      .face[data-color="sky"]   { --eye-color: #63d8ff; --eye-glow: rgba(99, 216, 255, .40); }
      .face[data-color="orange"]{ --eye-color: #ff9a2e; --eye-glow: rgba(255, 154, 46, .42); }
      .face[data-color="green"] { --eye-color: #5df08a; --eye-glow: rgba(93, 240, 138, .38); }
      .face[data-color="pink"]  { --eye-color: #ff7eb6; --eye-glow: rgba(255, 126, 182, .40); }

      /* 顔の輪郭と口（目の色に連動） */
      .outline {
        position: absolute;
        left: -10vmin;
        right: -10vmin;
        top: -9vmin;
        bottom: -13vmin;
        border: 1.3vmin solid var(--eye-color, #f4f7f7);
        border-radius: 46% 46% 48% 48% / 52% 52% 55% 55%;
        box-shadow: 0 0 6vmin 0 var(--eye-glow, rgba(190, 240, 255, .28)), inset 0 0 6vmin 0 var(--eye-glow, rgba(190, 240, 255, .28));
        opacity: .85;
        pointer-events: none;
      }
      .mouth {
        position: absolute;
        left: 50%;
        bottom: -9.5vmin;
        width: 13vmin;
        height: 6.5vmin;
        transform: translateX(-50%);
        border-bottom: 1.2vmin solid var(--eye-color, #f4f7f7);
        border-radius: 50%;
        pointer-events: none;
        transition: width .3s ease, height .3s ease;
      }
      .face[data-expr="happy"] .mouth { width: 18vmin; height: 9.5vmin; }
      .face[data-expr="surprised"] .mouth {
        width: 6.5vmin;
        height: 6.5vmin;
        border: 1.1vmin solid var(--eye-color, #f4f7f7);
      }
      .face[data-expr="sleepy"] .mouth, .face.drowsy .mouth, .face.asleep .mouth {
        width: 7vmin;
        height: 3vmin;
      }
      .face.no-outline .outline, .face.no-outline .mouth { display: none; }

      /* 表情 */
      .face[data-expr="happy"] .eye {
        height: 12.5vmin;
        border-radius: 50% 50% 16% 16% / 130% 130% 16% 16%;
      }
      .face[data-expr="sleepy"] .eye {
        height: 5.5vmin;
        border-radius: 999px;
      }
      .face[data-expr="surprised"] .eye {
        width: 22.5vmin;
        height: 30vmin;
        border-radius: 50%;
      }
      .face[data-expr="love"] .eye {
        background: transparent;
        box-shadow: none;
      }
      .face[data-expr="love"] .eye .heart {
        opacity: 1;
        transform: scale(1);
      }

      /* まばたき・ウインク（JSがクラスを付ける） */
      .face.blink .eye { transform: scaleY(.06); }
      .face.wink .eye.left { transform: scaleY(.06); }

      /* 声に反応中：音量に合わせて目が少し大きくなる */
      .face.listening:not(.blink):not(.wink) .eye {
        transform: scale(var(--listen-scale, 1.07));
      }

      /* 声まわりの状態表示（パネル内・小さく） */
      .voice-status {
        flex: 0 0 100%;
        text-align: center;
        font-size: .85rem;
        line-height: 1.35;
        color: rgba(255, 255, 255, .8);
        padding: 2px 8px 0;
      }
      .voice-status:empty { display: none; }

      /* 居眠り：ゆっくりまぶたが落ちて、静かに呼吸 */
      .face.drowsy .eye {
        height: 9vmin;
        transition: height 1.6s ease;
      }
      .face.asleep .eye {
        height: 4vmin;
        border-radius: 999px;
        transition: height 1.2s ease;
        animation: breathe 3.6s ease-in-out infinite;
      }
      @keyframes breathe {
        0%, 100% { transform: scaleY(1); }
        50% { transform: scaleY(.72); }
      }

      /* Zzz */
      .zzz {
        position: fixed;
        font-weight: 700;
        color: var(--z-color, #9fd9ef);
        opacity: 0;
        pointer-events: none;
        animation: zfloat 3.4s ease-out forwards;
        text-shadow: 0 0 12px rgba(120, 200, 240, .5);
      }
      @keyframes zfloat {
        0% { opacity: 0; transform: translate(0, 0) rotate(calc(var(--zr, 0deg) - 6deg)) scale(.8); }
        18% { opacity: .95; }
        100% { opacity: 0; transform: translate(var(--zx, 7vmin), var(--zy, -16vmin)) rotate(calc(var(--zr, 0deg) + 14deg)) scale(1.25); }
      }

      /* ===== 操作バー（普段は消える） ===== */
      .controls {
        position: fixed;
        left: 50%;
        bottom: max(14px, env(safe-area-inset-bottom));
        transform: translateX(-50%) translateY(8px);
        max-height: calc(100vh - 28px);
        max-height: calc(100dvh - 28px);
        overflow-y: auto;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        padding: 8px;
        max-width: 96%;
        background: rgba(22, 24, 28, .82);
        border: 1px solid rgba(255, 255, 255, .14);
        border-radius: 30px;
        opacity: 0;
        pointer-events: none;
        transition: opacity .35s ease, transform .35s ease;
        z-index: 10;
      }
      .controls.show {
        opacity: 1;
        pointer-events: auto;
        transform: translateX(-50%) translateY(0);
      }
      .controls button {
        appearance: none;
        border: 1px solid rgba(255, 255, 255, .16);
        background: rgba(255, 255, 255, .07);
        color: #f2f4f5;
        font: inherit;
        font-size: 1rem;
        line-height: 1;
        padding: 0 16px;
        border-radius: 999px;
        cursor: pointer;
        white-space: nowrap;
      }
      .controls button:active { background: rgba(255, 255, 255, .18); }
      .controls button[aria-pressed="true"] {
        background: #ff3b30;
        border-color: #ff3b30;
        color: #fff;
        font-weight: 700;
      }

      /* 計算モードの金額表示（お客さんにも見える大きさ） */
      .calc-display {
        position: fixed;
        left: 50%;
        bottom: max(96px, calc(env(safe-area-inset-bottom) + 84px));
        transform: translateX(-50%);
        max-height: calc(100vh - 112px);
        max-height: calc(100dvh - 112px);
        overflow-y: auto;
        background: rgba(12, 14, 18, .88);
        border: 1px solid rgba(255, 255, 255, .22);
        border-radius: 18px;
        padding: 14px 22px 16px;
        color: #fff;
        text-align: center;
        z-index: 11;
        min-width: 280px;
        max-width: 92vw;
      }
      .calc-display[hidden] { display: none; }
      .calc-display .calc-row {
        display: flex;
        justify-content: space-between;
        gap: 24px;
        font-size: 1.25rem;
        line-height: 1.5;
      }
      .calc-display .calc-total {
        font-size: 2.3rem;
        font-weight: 800;
        line-height: 1.3;
      }
      .calc-display .calc-change {
        font-size: 1.9rem;
        font-weight: 800;
        color: #ffb35c;
        line-height: 1.35;
      }
      .calc-display .calc-reset {
        margin-top: 10px;
        appearance: none;
        border: 1px solid rgba(255, 255, 255, .3);
        background: rgba(255, 255, 255, .1);
        color: #fff;
        font: inherit;
        font-size: 1rem;
        padding: 8px 20px;
        border-radius: 999px;
        cursor: pointer;
        min-height: 2.75rem;
      }
      .calc-display .calc-close {
        margin-top: 10px;
        margin-left: 8px;
        appearance: none;
        border: 1px solid rgba(255, 154, 46, .85);
        background: rgba(255, 154, 46, .3);
        color: #fff;
        font: inherit;
        font-size: 1rem;
        font-weight: 700;
        padding: 8px 20px;
        border-radius: 999px;
        cursor: pointer;
        min-height: 2.75rem;
      }

      .calc-display .calc-detail {
        font-size: 1.05rem;
        color: #ffd9a8;
        margin-top: 4px;
        line-height: 1.45;
      }
      .calc-display .calc-btns {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        margin-top: 10px;
      }
      .calc-display .calc-btns .calc-btns-label {
        width: 100%;
        font-size: .85rem;
        color: rgba(255, 255, 255, .65);
      }
      .calc-display .calc-btns button {
        appearance: none;
        border: 1px solid rgba(255, 255, 255, .3);
        background: rgba(255, 255, 255, .12);
        color: #fff;
        font: inherit;
        font-size: 1.05rem;
        font-weight: 700;
        padding: 10px 14px;
        border-radius: 12px;
        cursor: pointer;
        min-height: 2.75rem;
      }
      .calc-display .calc-btns button:active { background: rgba(255, 154, 46, .55); }

      /* メモ／声かけ設定の小パネル */
      .mini-panel {
        position: fixed;
        left: 50%;
        top: max(64px, calc(env(safe-area-inset-top) + 52px));
        transform: translateX(-50%);
        background: rgba(12, 14, 18, .92);
        border: 1px solid rgba(255, 255, 255, .22);
        border-radius: 16px;
        padding: 14px 18px;
        color: #fff;
        z-index: 12;
        width: min(430px, 92vw);
        max-height: 62vh;
        overflow-y: auto;
      }
      .mini-panel[hidden] { display: none; }
      .mini-panel h2 { font-size: 1.05rem; margin: 0 0 8px; }
      .mini-panel ul { margin: 0; padding-left: 1.1em; font-size: 1.05rem; line-height: 1.6; }
      .mini-panel .mini-close {
        margin-top: 10px;
        appearance: none;
        border: 1px solid rgba(255, 255, 255, .3);
        background: rgba(255, 255, 255, .1);
        color: #fff;
        font: inherit;
        padding: 8px 18px;
        border-radius: 999px;
        cursor: pointer;
        min-height: 2.75rem;
      }
      .mini-panel .remind-form { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
      .mini-panel input[type="time"], .mini-panel input[type="text"] {
        font: inherit;
        font-size: 1rem;
        padding: 8px 10px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, .3);
        background: rgba(255, 255, 255, .1);
        color: #fff;
        min-height: 2.75rem;
      }
      .mini-panel input[type="text"] { flex: 1; min-width: 160px; }
      .mini-panel .remind-add {
        appearance: none;
        border: 1px solid #ff9a2e;
        background: #ff9a2e;
        color: #1a1206;
        font: inherit;
        font-weight: 700;
        padding: 8px 16px;
        border-radius: 10px;
        cursor: pointer;
        min-height: 2.75rem;
      }
      .mini-panel .remind-item { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 4px 0; font-size: 1.05rem; }
      .mini-panel .remind-del {
        appearance: none;
        border: 1px solid rgba(255, 255, 255, .3);
        background: transparent;
        color: #fff;
        font: inherit;
        font-size: .9rem;
        padding: 4px 12px;
        border-radius: 999px;
        cursor: pointer;
      }
      /* 電光掲示板（右から左へ流れる文字） */
      .ticker {
        position: fixed;
        left: 0;
        right: 0;
        top: 50%;
        transform: translateY(-50%);
        overflow: hidden;
        white-space: nowrap;
        z-index: 8;
        pointer-events: none;
        background: rgba(0, 0, 0, .55);
        padding: 10px 0;
      }
      .ticker[hidden] { display: none; }
      .ticker-inner {
        display: inline-block;
        font-size: 4.2rem;
        font-weight: 800;
        letter-spacing: .06em;
        color: #ffb35c;
        text-shadow: 0 0 14px rgba(255, 154, 46, .65);
        padding-left: 100vw;
        animation: ticker-scroll 12s linear infinite;
      }
      @keyframes ticker-scroll {
        from { transform: translateX(0); }
        to { transform: translateX(-100%); }
      }
      .mini-panel .ticker-presets { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
      .mini-panel .ticker-presets button {
        appearance: none;
        border: 1px solid rgba(255, 255, 255, .3);
        background: rgba(255, 255, 255, .1);
        color: #fff;
        font: inherit;
        font-size: .95rem;
        padding: 8px 14px;
        border-radius: 999px;
        cursor: pointer;
        min-height: 2.75rem;
      }

      /* 翻訳モードの英語表示 */
      .trans-display {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        background: rgba(12, 14, 18, .9);
        border: 1px solid rgba(255, 255, 255, .25);
        border-radius: 18px;
        padding: 22px 30px;
        color: #fff;
        font-size: 2.4rem;
        font-weight: 800;
        line-height: 1.35;
        text-align: center;
        z-index: 11;
        max-width: 92vw;
      }
      .trans-display[hidden] { display: none; }

      .hint {
        position: fixed;
        left: 50%;
        top: max(16px, env(safe-area-inset-top));
        transform: translateX(-50%);
        font-size: .9rem;
        letter-spacing: .04em;
        color: rgba(255, 255, 255, .66);
        background: rgba(20, 22, 26, .55);
        padding: 8px 16px;
        border-radius: 999px;
        pointer-events: none;
        transition: opacity 1s ease;
        white-space: nowrap;
        z-index: 9;
      }
      .hint.gone { opacity: 0; }

      @media (prefers-reduced-motion: reduce) {
        .rotator { transition: none; }
        .face { transition: none; }
        .face.bounce { animation: none; }
        .face.asleep .eye { animation: none; }
        .zzz { animation-duration: .1s; }
      }
    </style>
  </head>
  <body>
    <div class="rotator" id="rotator" data-rot="0">
    <main class="stage" id="stage" aria-label="ロボットの目。タップすると反応します">
      <div class="face" id="face" data-color="white" data-expr="normal">
        <div class="outline" aria-hidden="true"></div>
        <div class="mouth" aria-hidden="true"></div>
        <div class="eye left">
          <span class="heart" aria-hidden="true">
            <svg viewBox="0 0 100 92"><path d="M50 84C20 62 6 44 6 27 6 12 17 3 29 3c9 0 17 5 21 12C54 8 62 3 71 3c12 0 23 9 23 24 0 17-14 35-44 57z"/></svg>
          </span>
        </div>
        <div class="eye right">
          <span class="heart" aria-hidden="true">
            <svg viewBox="0 0 100 92"><path d="M50 84C20 62 6 44 6 27 6 12 17 3 29 3c9 0 17 5 21 12C54 8 62 3 71 3c12 0 23 9 23 24 0 17-14 35-44 57z"/></svg>
          </span>
        </div>
      </div>
    </main>

    <p class="hint" id="hint">タップで反応 ・ 横置きは「画面を90°回転」</p>

    <div class="calc-display" id="calcDisplay" hidden>
      <div class="calc-total">合計 <span id="calcTotal">0</span>円</div>
      <div class="calc-row"><span>お預かり</span><span><span id="calcReceived">0</span>円</span></div>
      <div class="calc-change">お釣り <span id="calcChange">0</span>円</div>
      <div class="calc-detail" id="calcDetail"></div>
      <div class="calc-btns" id="calcItemBtns"><span class="calc-btns-label">商品（タップで足す）</span></div>
      <div class="calc-btns" id="calcRecvBtns"><span class="calc-btns-label">お預かり（タップでセット）</span></div>
      <button type="button" class="calc-reset" id="btnCalcReset">次のお客さん（クリア）</button>
      <button type="button" class="calc-close" id="btnCalcClose">✕ 閉じる</button>
    </div>

    <div class="mini-panel" id="memoPanel" hidden>
      <h2>メモ</h2>
      <ul id="memoList"></ul>
      <button type="button" class="mini-close" id="btnMemoClose">閉じる</button>
    </div>

    <div class="mini-panel" id="remindPanel" hidden>
      <h2>声かけ設定（時刻になると声で知らせます）</h2>
      <div class="remind-form">
        <input type="time" id="remindTime" value="08:00">
        <input type="text" id="remindText" placeholder="例：お薬の時間ですよ" maxlength="60">
        <button type="button" class="remind-add" id="btnRemindAdd">追加</button>
      </div>
      <div id="remindList"></div>
      <button type="button" class="mini-close" id="btnRemindClose">閉じる</button>
    </div>

    <div class="ticker" id="ticker" hidden><span class="ticker-inner" id="tickerInner">いらっしゃいませ！</span></div>

    <div class="trans-display" id="transDisplay" hidden></div>

    <div class="mini-panel" id="tickerPanel" hidden>
      <h2>電光掲示板（流す文字）</h2>
      <div class="remind-form">
        <input type="text" id="tickerText" placeholder="例：いらっしゃいませ！手作り品あります" maxlength="60">
        <button type="button" class="remind-add" id="btnTickerSet">流す</button>
      </div>
      <div class="ticker-presets">
        <button type="button" data-ticker="いらっしゃいませ！">いらっしゃいませ</button>
        <button type="button" data-ticker="手作り品あります。見ていってください！">手作り品あります</button>
        <button type="button" data-ticker="本日セール中！">セール中</button>
        <button type="button" data-ticker="ありがとうございました！">ありがとう</button>
      </div>
      <button type="button" class="mini-close" id="btnTickerStop">掲示板を止める</button>
      <button type="button" class="mini-close" id="btnTickerClose">閉じる</button>
    </div>

    <nav class="controls" id="controls" aria-label="目の設定">
      <button type="button" id="btnExpr">表情：ふつう</button>
      <button type="button" id="btnColor">色：しろ</button>
      <button type="button" id="btnVoice" aria-pressed="false">声に反応：オフ</button>
      <button type="button" id="btnChat" aria-pressed="true">おしゃべり：オン</button>
      <button type="button" id="btnOutline" aria-pressed="true">輪郭：オン</button>
      <button type="button" id="btnListen" aria-pressed="false">聞き取り：オフ</button>
      <button type="button" id="btnCalc" aria-pressed="false">計算モード：オフ</button>
      <button type="button" id="btnCall" aria-pressed="false">呼び込み：オフ</button>
      <button type="button" id="btnMemo">メモ</button>
      <button type="button" id="btnRemind">声かけ設定</button>
      <button type="button" id="btnTicker">掲示板</button>
      <button type="button" id="btnTrans" aria-pressed="false">翻訳：オフ</button>
      <button type="button" id="btnSound" aria-pressed="false">音：オフ</button>
      <button type="button" id="btnWake" aria-pressed="false">画面つけっぱなし</button>
      <button type="button" id="btnFull">全画面</button>
      <button type="button" id="btnRot">画面を90°回転</button>
      <span class="voice-status" id="voiceStatus" role="status"></span>
    </nav>
    </div>

    <script>
      (function () {
        /* ---------- 版と自動更新（新しい版が出たら自動で読み直す） ---------- */
        var PAGE_VERSION = '20261114-13';
        try {

        var stage = document.getElementById('stage');

        /* ---------- 状態 ---------- */

          { id: 'love',      label: 'らぶ' },

        /* ---------- まばたき ---------- */

            face.classList.remove('blink');

          setTimeout(function () {
            var r = Math.random();

            } else if (r < 0.28) {
              blinkOnce(false);                   // たまに二度まばたき

        /* ---------- キョロキョロ ---------- */
        var gazeSpots = [
          [0, 0], [0, 0], [-4.2, -0.6], [4.2, -0.6], [-3.4, 1.2],
          [3.4, 1.2], [0, -1.8], [0, 1.4], [-5, 0.4], [5, 0.4]
        ];
        function wander() {
          if (!sleeping && !reduceMotion && !voiceActive) {
            var s = gazeSpots[Math.floor(Math.random() * gazeSpots.length)];
            face.style.transform = 'translate(' + s[0] + 'vmin,' + s[1] + 'vmin)';
          }
          setTimeout(wander, 2400 + Math.random() * 3200);

        function lookAt(clientX, clientY) {
          // タップ位置を「回転後の画面」の座標系に直してから視線に変える
          var W = window.innerWidth, H = window.innerHeight;
          var dx = clientX - W / 2, dy = clientY - H / 2;
          var rad = -rotDeg * Math.PI / 180;
          var cos = Math.cos(rad), sin = Math.sin(rad);
          var lx = dx * cos - dy * sin;
          var ly = dx * sin + dy * cos;
          var lw = (rotDeg === 90 || rotDeg === 270) ? H : W;
          var lh = (rotDeg === 90 || rotDeg === 270) ? W : H;
          var gx = (lx / lw) * 11;
          var gy = (ly / lh) * 5;
          face.style.transform = 'translate(' + gx.toFixed(1) + 'vmin,' + gy.toFixed(1) + 'vmin)';
        }

        /* ---------- 音（ピッという電子音） ---------- */
        function ensureAudio() {
          if (!audioCtx) {
            try {
              audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            } catch (e) { return null; }
          }
          if (audioCtx.state === 'suspended') audioCtx.resume();
          return audioCtx;
        }
        function tone(freq, delay, dur, vol) {
          var ctx = ensureAudio();
          if (!ctx) return;
          var t = ctx.currentTime + (delay || 0);
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(vol || 0.04, t);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.15));
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(t); osc.stop(t + (dur || 0.15) + 0.05);
        }
        function softTone(freq, delay, dur, vol) {
          var ctx = ensureAudio();
          if (!ctx) return;
          var t = ctx.currentTime + (delay || 0);
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(0.0001, t);
          gain.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.06);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.5));
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(t); osc.stop(t + (dur || 0.5) + 0.05);
        }
        /* 画面に触れた時、音の仕組みが止まっていたら作り直す（iPhone対策） */
        document.addEventListener('pointerdown', function () {
          if (audioCtx && audioCtx.state !== 'running') {
            try { audioCtx.close(); } catch (e) {}
            audioCtx = null;
          }
          ensureAudio();
        }, true);
        function blip(freq) {
          if (!soundOn) return;
          try {
            if (!ensureAudio()) return;
            var t = audioCtx.currentTime;
            var osc = audioCtx.createOscillator();
            var gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(freq || 740, t);
            osc.frequency.exponentialRampToValueAtTime((freq || 740) * 1.6, t + 0.09);
            gain.gain.setValueAtTime(0.045, t);
            gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(t); osc.stop(t + 0.15);
          } catch (e) { /* 音が出ない環境では黙る */ }
        }

        /* ---------- 居眠り ---------- */
        var idleTimer = null, zTimer = null;
        function spawnZ() {
          if (!sleeping) return;
          var z = document.createElement('span');
          z.className = 'zzz';
          z.textContent = Math.random() < 0.5 ? 'Z' : 'z';
          var r = face.getBoundingClientRect();
          z.style.left = (r.right - r.width * 0.18) + 'px';
          z.style.top = (r.top + r.height * 0.08) + 'px';
          z.style.fontSize = (20 + Math.random() * 22) + 'px';
          // Zzzも回転後の「上」へ流れるようにする
          var zVec = { 0: [7, -16], 90: [16, 7], 180: [-7, 16], 270: [-16, -7] };
          var zv = zVec[rotDeg];
          z.style.setProperty('--zx', zv[0] + 'vmin');
          z.style.setProperty('--zy', zv[1] + 'vmin');
          z.style.setProperty('--zr', rotDeg + 'deg');
          document.body.appendChild(z);
          setTimeout(function () { z.remove(); }, 3500);
        }
        function goSleepy() {
          face.classList.add('drowsy');
          setTimeout(function () {
            if (face.classList.contains('drowsy')) {
              face.classList.add('asleep');
              sleeping = true;
              face.style.transform = 'translate(0, 0.8vmin)';
              spawnZ();
              zTimer = setInterval(spawnZ, 2600);
            }
          }, 5000);
        }
        function wakeUp() {
          if (!sleeping && !face.classList.contains('drowsy')) return;
          sleeping = false;
          face.classList.remove('drowsy');
          face.classList.remove('asleep');
          if (zTimer) { clearInterval(zTimer); zTimer = null; }
          // 目覚めはびっくり顔で
          var prev = face.dataset.expr;
          face.dataset.expr = 'surprised';
          blip(980);
          setTimeout(function () { face.dataset.expr = prev; }, 700);
        }
        function resetIdle() {
          if (idleTimer) clearTimeout(idleTimer);

        }
        resetIdle();

        /* ---------- タップ反応 ---------- */
        var controlsTimer = null;

          controlsTimer = setTimeout(function () {
            controls.classList.remove('show');

        setTimeout(function () { hint.classList.add('gone'); }, 6000);

        stage.addEventListener('pointerdown', function (ev) {
          resetIdle();
          var wasSleeping = sleeping || face.classList.contains('drowsy');
          wakeUp();
          showControls();
          lookAt(ev.clientX, ev.clientY);
          if (!wasSleeping) {
            blinkOnce(false);
            blip(740);

        /* キーボードでも起こして操作バーを出せる */

          wakeUp();
          showControls();

        });

        /* ---------- 声に反応（おかんの話し相手） ---------- */
        var voiceOn = false;        // マイク監視中
        var micPending = false;     // マイク許可待ち
        var chatOn = true;          // おしゃべり（音声の返事）デフォルトはオン
        var micStream = null, analyser = null, volTimer = null;
        var voiceActive = false, lastVoiceAt = 0;
        var voiceStatus = document.getElementById('voiceStatus');
        function setVoiceStatus(msg) { voiceStatus.textContent = msg; }

        function startMic() {
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            setVoiceStatus('この環境ではマイクが使えません（未対応）');
            return;
          }
          micPending = true;
          setVoiceStatus('マイクの許可をお願いします…');
          navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
            micPending = false;
            var ctx = ensureAudio();
            if (!ctx) {
              stream.getTracks().forEach(function (t) { t.stop(); });
              setVoiceStatus('この環境ではマイクが使えません（未対応）');
              return;
            }
            micStream = stream;
            var src = ctx.createMediaStreamSource(stream);
            analyser = ctx.createAnalyser();
            analyser.fftSize = 512;
            src.connect(analyser);
            voiceOn = true;
            btnVoice.setAttribute('aria-pressed', 'true');
            btnVoice.textContent = '声に反応：オン';
            startVolMonitor();
            // 音量への反応はこの端末の中だけで処理する（声は外に送らない）
            if (!recogWanted) {
              setVoiceStatus('声に反応中（聞き取りはオフ・声は外に送りません）');
            }
          }).catch(function () {
            micPending = false;
            voiceOn = false;
            btnVoice.setAttribute('aria-pressed', 'false');
            btnVoice.textContent = '声に反応：オフ';
            setVoiceStatus('マイクが使えませんでした（許可が必要です）');
          });

        function releaseMicStream() {
          // getUserMediaのマイクを手放す（iOSでは音声認識と共有できないため）
          if (volTimer) { clearInterval(volTimer); volTimer = null; }
          if (micStream) {
            micStream.getTracks().forEach(function (t) { t.stop(); });
            micStream = null;
          }
          analyser = null;
          voiceActive = false;
          face.classList.remove('listening');

        function stopMic() {
          voiceOn = false;
          resumeMicAfterRecog = false;
          releaseMicStream();
          stopRecog();
          btnListen.setAttribute('aria-pressed', 'false');
          btnListen.textContent = '聞き取り：オフ';
          btnVoice.setAttribute('aria-pressed', 'false');
          btnVoice.textContent = '声に反応：オフ';
          setVoiceStatus('');
        }

        /* 音量の監視：声が聞こえたら反応し、居眠りタイマーをリセットする */
        function startVolMonitor() {
          var data = new Uint8Array(analyser.fftSize);
          volTimer = setInterval(function () {
            if (!analyser) return;
            analyser.getByteTimeDomainData(data);
            var sum = 0;
            for (var i = 0; i < data.length; i++) {
              var v = (data[i] - 128) / 128;
              sum += v * v;
            }
            var rms = Math.sqrt(sum / data.length);
            if (rms > 0.055) {
              onVoiceHeard(rms);
            } else if (voiceActive && Date.now() - lastVoiceAt > 800) {
              voiceActive = false;
              face.classList.remove('listening');
            }
          }, 120);
        }
        function onVoiceHeard(rms) {
          lastVoiceAt = Date.now();
          resetIdle();   // 話しかけられている間は寝ない
          if (sleeping || face.classList.contains('drowsy')) wakeUp();
          face.classList.add('listening');
          // 話し手の方（中央寄り）を見る
          face.style.transform = 'translate(0, 0.6vmin)';
          // 音量に合わせて目を少し大きく
          var s = 1 + Math.min(rms * 1.6, 0.28);
          face.style.setProperty('--listen-scale', s.toFixed(2));
          if (!voiceActive) {
            voiceActive = true;
            if (face.dataset.expr === 'normal' && !reduceMotion) {
              face.dataset.expr = 'happy';
              face.classList.remove('bounce');
              void face.offsetWidth;
              face.classList.add('bounce');
              setTimeout(function () {

        /* ---------- おしゃべり（音声合成） ---------- */
        var speaking = false, speakEndAt = 0;
        function primeSpeech() {
          // ユーザー操作を起点に初期化する（iOSの自動再生制限対策）
          try {
            if (!('speechSynthesis' in window)) return;
            speechSynthesis.getVoices();
            var u = new SpeechSynthesisUtterance('');
            u.volume = 0;
            speechSynthesis.speak(u);
          } catch (e) { /* 喋れない環境では黙る */ }
        }
        function speak(text) {
          if (!chatOn || !('speechSynthesis' in window)) return;
          try {
            var u = new SpeechSynthesisUtterance(text);
            u.lang = 'ja-JP';
            u.rate = 1.05;
            u.pitch = 1.15;
            var voices = speechSynthesis.getVoices();
            for (var i = 0; i < voices.length; i++) {
              if (voices[i].lang && voices[i].lang.indexOf('ja') === 0) {
                u.voice = voices[i];
                break;
              }
            }
            u.onstart = function () { speaking = true; };
            u.onend = function () { speaking = false; speakEndAt = Date.now(); };
            u.onerror = function () { speaking = false; speakEndAt = Date.now(); };
            speechSynthesis.cancel();
            speechSynthesis.speak(u);
          } catch (e) { /* 喋れない環境では黙る */ }
        }
        function speakReminder(text) {
          if (!('speechSynthesis' in window)) return;
          try {
            var u = new SpeechSynthesisUtterance(text);
            u.lang = 'ja-JP';
            u.rate = 0.9;
            u.pitch = 1.15;
            var voices = speechSynthesis.getVoices();
            for (var i = 0; i < voices.length; i++) {
              if (voices[i].lang && voices[i].lang.indexOf('ja') === 0) {
                u.voice = voices[i];
                break;
              }
            }
            speechSynthesis.speak(u);
          } catch (e) { /* 喋れない環境では黙る */ }
        }
        function playMelody() {
          var notes = [523, 587, 659, 784, 880, 784, 659, 587, 523];
          for (var i = 0; i < notes.length; i++) {
            tone(notes[i], i * 0.17, 0.16, 0.05);
          }
        }

        /* ---------- 聞き取り（音声認識） ----------
           ブラウザの音声認識は、声をブラウザ提供元（Google・Appleなど）の
           サーバーに送って文字に変換する仕組み。だから自動では始めず、
           「聞き取り」ボタンを押したときだけ・自動再開なしで動かす。 */
        var Recog = window.SpeechRecognition || window.webkitSpeechRecognition;
        var recog = null, recogWanted = false;
        var resumeMicAfterRecog = false;  // 聞き取り中だけ声に反応のマイクを手放し、終わったら戻す
        var recogWatchdog = null, recogHeard = false;
        function clearRecogWatchdog() {
          if (recogWatchdog) { clearTimeout(recogWatchdog); recogWatchdog = null; }
        }
        function maybeResumeMic() {
          // 聞き取りが終わったら、元々オンだった声に反応を再開する
          if (resumeMicAfterRecog && voiceOn && !micPending) {
            resumeMicAfterRecog = false;
            startMic();
          } else {
            resumeMicAfterRecog = false;
          }
        }
        function recogUiOff(msg) {
          recogWanted = false;
          btnListen.setAttribute('aria-pressed', 'false');
          btnListen.textContent = '聞き取り：オフ';
          if (msg) setVoiceStatus(msg);
        }
        function startRecog() {
          if (!Recog) {
            setVoiceStatus('この環境では聞き取りが使えません（未対応）');
            return;
          }
          // iOSでは getUserMedia のマイクを掴んだままだと音声認識が始まらない
          // （目は動くのに何も聞き取れない・画面にも何も出ない症状の原因）。
          // 聞き取りの間だけ声に反応のマイクを手放し、終わったら戻す。
          if (voiceOn) {
            resumeMicAfterRecog = true;

            if (recogWanted) {

              recogUiOff('聞き取りが止まりました（続けるには「聞き取り」を押してください）');

            recog.start();
            btnListen.setAttribute('aria-pressed', 'true');
            btnListen.textContent = '聞き取り：オン';
            setVoiceStatus('聞き取りを始めています…');

          }
        }

        /* 聞き取った言葉への返事 */
        function tempExpr(id, ms) {
          face.dataset.expr = id;
          setTimeout(function () { face.dataset.expr = exprs[exprIdx].id; }, ms);
        }
        function handleHeard(text) {
          if (!text) return;
          setVoiceStatus('聞こえた：「' + text + '」');
          if (speaking || Date.now() - speakEndAt < 900) return;  // 自分の声には反応しない
          resetIdle();
          if (sleeping || face.classList.contains('drowsy')) wakeUp();
          if (handleMemo(text)) return;
          if (transOn && handleTranslate(text)) return;
          if (calcOn && handleCalc(text)) return;
          if (text.indexOf('何時') !== -1) {
            var d = new Date();
            speak('いま、' + d.getHours() + '時' + d.getMinutes() + '分です');
            tempExpr('happy', 2200);
          } else if (text.indexOf('おはよう') !== -1) {
            speak('おはようございます');
            tempExpr('happy', 2200);
          } else if (text.indexOf('こんにちは') !== -1 || text.indexOf('こんにちわ') !== -1) {
            speak('こんにちは');
            tempExpr('happy', 2200);
          } else if (text.indexOf('こんばんは') !== -1 || text.indexOf('こんばんわ') !== -1) {
            speak('こんばんは');
            tempExpr('happy', 2200);
          } else if (text.indexOf('ありがとう') !== -1) {
            speak('どういたしまして');
            tempExpr('love', 2200);
          } else if (text.indexOf('おやすみ') !== -1) {
            speak('おやすみなさい');
            tempExpr('sleepy', 4000);
          } else if (text.indexOf('名前') !== -1) {
            speak('わたしはロボットです');
            tempExpr('happy', 2200);
          } else if (text.indexOf('元気') !== -1) {
            speak('げんきですよ');
            tempExpr('happy', 2200);
          } else if (text.indexOf('歌') !== -1 || text.indexOf('うた') !== -1) {
            tempExpr('happy', 3200);
            if (chatOn) playMelody();
          } else if (face.dataset.expr === 'normal' && !reduceMotion) {
            // 言葉が分からなくても、聞こえたらうれしい反応だけする

        /* ---------- 計算モード（イベント売り場の相方） ----------
           「聞き取り」で聞こえた金額を拾って、合計・お預かり・お釣りを
           大きく表示し、声でも伝える。計算モードがオンのときだけ動く。
           商品の金額を言うたびに合計へ足していく方式。 */
        var calcOn = false;
        var calcTotal = 0, calcReceived = 0;
        var elCalcDisplay = document.getElementById('calcDisplay');
        var elCalcTotal = document.getElementById('calcTotal');
        var elCalcReceived = document.getElementById('calcReceived');
        var elCalcChange = document.getElementById('calcChange');
        var btnCalc = document.getElementById('btnCalc');
        var btnCalcReset = document.getElementById('btnCalcReset');

        function fmtYen(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
        function renderCalc() {
          elCalcTotal.textContent = fmtYen(calcTotal);
          elCalcReceived.textContent = fmtYen(calcReceived);
          var ch = calcReceived - calcTotal;
          elCalcChange.textContent = fmtYen(ch > 0 ? ch : 0);
        }
        function resetCalc() {
          calcTotal = 0; calcReceived = 0; renderCalc();
          var d = document.getElementById('calcDetail');
          if (d) d.textContent = '';
        }

        /* 漢数字（一〜九・十・百・千・万）を数に直す */
        var KNUM = { '一': 1, '二': 2, '三': 3, '四': 4, '五': 5, '六': 6, '七': 7, '八': 8, '九': 9 };
        function kanjiToNumber(s) {
          if (!s) return null;
          var total = 0, section = 0, num = 0, seen = false;
          for (var i = 0; i < s.length; i++) {
            var c = s[i];
            if (KNUM[c] !== undefined) { num = KNUM[c]; seen = true; }
            else if (c === '十') { section += (num || 1) * 10; num = 0; seen = true; }
            else if (c === '百') { section += (num || 1) * 100; num = 0; seen = true; }
            else if (c === '千') { section += (num || 1) * 1000; num = 0; seen = true; }
            else if (c === '万') { total += ((section + num) || 1) * 10000; section = 0; num = 0; seen = true; }
            else { return null; }
          }
          if (!seen) return null;
          return total + section + num;
        }

        /* テキスト中の「○○円」を位置つきで全部拾う（数字・漢数字の両対応） */
        function extractYenList(t) {
          var list = [], m;
          var reD = /(\d+)\s*円/g;
          while ((m = reD.exec(t)) !== null) { list.push({ v: parseInt(m[1], 10), i: m.index }); }
          var reK = /([一二三四五六七八九十百千万]+)\s*円/g;
          while ((m = reK.exec(t)) !== null) {
            var v = kanjiToNumber(m[1]);
            if (v !== null) list.push({ v: v, i: m.index });
          }
          list.sort(function (a, b) { return a.i - b.i; });
          return list;
        }

        function handleCalc(text) {
          var t = text.replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); }).replace(/[,、，]/g, '');
          if (t.indexOf('クリア') !== -1 || t.indexOf('リセット') !== -1 || t.indexOf('最初から') !== -1 || t.indexOf('次のお客') !== -1) {
            resetCalc();
            speak('クリアしました');
            tempExpr('happy', 1200);
            return true;
          }
          var list = extractYenList(t);
          if (!list.length) return false;
          var azukariIdx = t.indexOf('預か');
          var received = null;
          if (azukariIdx !== -1) {
            var bestDist = 1e9;
            for (var i = 0; i < list.length; i++) {
              var d = Math.abs(list[i].i - azukariIdx);
              if (d < bestDist) { bestDist = d; received = list[i]; }
            }
          }
          for (var j = 0; j < list.length; j++) {
            if (received && list[j] === received) { calcReceived = list[j].v; }
            else { calcTotal += list[j].v; }
          }
          announceCalc(true);
          return true;
        }

        btnCalc.addEventListener('click', function () {

          elCalcDisplay.hidden = !calcOn;
          if (calcOn) {
            resetCalc();

        var elCalcDetail = document.getElementById('calcDetail');

        /* お釣りの内訳（金種）を文章にする */
        function changeBreakdownText(n) {
          if (n <= 0) return '';
          var denoms = [[10000, '一万円札'], [5000, '五千円札'], [1000, '千円札'], [500, '五百円玉'], [100, '百円玉'], [50, '五十円玉'], [10, '十円玉'], [5, '五円玉'], [1, '一円玉']];
          var parts = [];
          for (var i = 0; i < denoms.length; i++) {
            var c = Math.floor(n / denoms[i][0]);
            if (c > 0) { parts.push(denoms[i][1] + c + '枚'); n -= c * denoms[i][0]; }
          }
          return parts.join('、');
        }

        /* 計算結果の表示＋読み上げ（声・ボタンの共通処理） */
        function announceCalc(sayIt) {

          elCalcDetail.textContent = (calcReceived > 0 && ch > 0) ? ('内訳：' + changeBreakdownText(ch)) : '';

            } else {
              speak('合計' + calcTotal + '円です。あと' + (-ch) + '円足りません');
            }
          } else if (calcTotal > 0) {
            speak('合計' + calcTotal + '円です');

        }

        /* 声かけ設定（決まった時刻に声で知らせる） */
        function loadReminders() {

        function renderReminders() {

        document.getElementById('btnRemindAdd').addEventListener('click', function () {

          list.forEach(function (r, idx) {

            var parts = r.time.split(':');
            var tMin = parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
            var late = nowMin - tMin;
            if (!remindFired[key] && late >= 0 && late <= 15) {

        /* ---------- 翻訳モード（フレーズ方式・日→英） ----------

        var transOn = false;

        var PHRASES = [
          ['いらっしゃい', 'Welcome!'],

          ['こんにちは', 'Hello!'],
          ['こんにちわ', 'Hello!'],

        function speakEn(text) {

            u.onend = function () { speaking = false; speakEndAt = Date.now(); };
            u.onerror = function () { speaking = false; speakEndAt = Date.now(); };

        /* 画面つけっぱなし（Wake Lock） */

          btnFull.textContent = document.fullscreenElement ? '全画面をやめる' : '全画面';
        });

        /* 画面を90°回転（縦固定ビューワーでも横置きに合わせる） */
        btnRot.addEventListener('click', function () {
          rotDeg = (rotDeg + 90) % 360;
          rotator.dataset.rot = String(rotDeg);
          rotator.style.setProperty('--rot', rotDeg + 'deg');
          blip(880);
          showControls();
          resetIdle();
        });
      })();
    </script>
  </body>
</html>
