<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ロボット" />
    <!-- この画面は「ロボットの顔」そのものなので、常に真っ黒が正解。darkのみ宣言する。 -->
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>ロボットの目</title>
    <style>
      button { min-height: 2.75rem; }

      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: #000;
        color: #fff;
        font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
      }

      /* ===== 顔 ===== */
      .stage {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        cursor: pointer;
      }
      /* 画面回転：ビューワーが縦固定でも、表示全体を90°ずつ回して横置きに合わせる */
      .rotator {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        transform: translate(-50%, -50%) rotate(var(--rot, 0deg));
        transition: transform .45s cubic-bezier(.34, 1.2, .5, 1);
      }
      .rotator[data-rot="90"], .rotator[data-rot="270"] {
        width: 100vh;
        width: 100dvh;
        height: 100vw;
      }
      .face {
        display: flex;
        align-items: center;
        gap: 15vmin;
        transition: transform .38s cubic-bezier(.34, 1.3, .5, 1);
        will-change: transform;
      }
      .face.bounce { animation: bounce .55s ease; }
      @keyframes bounce {
        0% { margin-top: 0; }
        35% { margin-top: -3.2vmin; }
        70% { margin-top: .8vmin; }
        100% { margin-top: 0; }
      }

      .eye {
        position: relative;
        width: 19vmin;
        height: 26vmin;
        border-radius: 42% / 46%;
        background: var(--eye-color, #f4f7f7);
        box-shadow: 0 0 6vmin 0 var(--eye-glow, rgba(190, 240, 255, .28));
        transition:
          height .45s cubic-bezier(.4, 0, .3, 1),
          width .45s cubic-bezier(.4, 0, .3, 1),
          border-radius .45s cubic-bezier(.4, 0, .3, 1),
          background-color .3s ease,
          transform .07s ease-in;
        flex: none;
      }
      .eye .heart {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        opacity: 0;
        transform: scale(.4);
        transition: opacity .25s ease, transform .35s cubic-bezier(.34, 1.6, .5, 1);
      }
      .eye .heart svg { width: 88%; height: 88%; }
      .eye .heart path { fill: var(--eye-color, #f4f7f7); }

      /* 色バリエーション */
      .face[data-color="white"] { --eye-color: #f4f7f7; --eye-glow: rgba(200, 235, 255, .30); }
      .face[data-color="sky"]   { --eye-color: #63d8ff; --eye-glow: rgba(99, 216, 255, .40); }
      .face[data-color="orange"]{ --eye-color: #ff9a2e; --eye-glow: rgba(255, 154, 46, .42); }
      .face[data-color="green"] { --eye-color: #5df08a; --eye-glow: rgba(93, 240, 138, .38); }
      .face[data-color="pink"]  { --eye-color: #ff7eb6; --eye-glow: rgba(255, 126, 182, .40); }

      /* 表情 */
      .face[data-expr="happy"] .eye {
        height: 12.5vmin;
        border-radius: 50% 50% 16% 16% / 130% 130% 16% 16%;
      }
      .face[data-expr="sleepy"] .eye {
        height: 5.5vmin;
        border-radius: 999px;
      }
      .face[data-expr="surprised"] .eye {
        width: 22.5vmin;
        height: 30vmin;
        border-radius: 50%;
      }
      .face[data-expr="love"] .eye {
        background: transparent;
        box-shadow: none;
      }
      .face[data-expr="love"] .eye .heart {
        opacity: 1;
        transform: scale(1);
      }

      /* まばたき・ウインク（JSがクラスを付ける） */
      .face.blink .eye { transform: scaleY(.06); }
      .face.wink .eye.left { transform: scaleY(.06); }

      /* 居眠り：ゆっくりまぶたが落ちて、静かに呼吸 */
      .face.drowsy .eye {
        height: 9vmin;
        transition: height 1.6s ease;
      }
      .face.asleep .eye {
        height: 4vmin;
        border-radius: 999px;
        transition: height 1.2s ease;
        animation: breathe 3.6s ease-in-out infinite;
      }
      @keyframes breathe {
        0%, 100% { transform: scaleY(1); }
        50% { transform: scaleY(.72); }
      }

      /* Zzz */
      .zzz {
        position: fixed;
        font-weight: 700;
        color: var(--z-color, #9fd9ef);
        opacity: 0;
        pointer-events: none;
        animation: zfloat 3.4s ease-out forwards;
        text-shadow: 0 0 12px rgba(120, 200, 240, .5);
      }
      @keyframes zfloat {
        0% { opacity: 0; transform: translate(0, 0) rotate(calc(var(--zr, 0deg) - 6deg)) scale(.8); }
        18% { opacity: .95; }
        100% { opacity: 0; transform: translate(var(--zx, 7vmin), var(--zy, -16vmin)) rotate(calc(var(--zr, 0deg) + 14deg)) scale(1.25); }
      }

      /* ===== 操作バー（普段は消える） ===== */
      .controls {
        position: fixed;
        left: 50%;
        bottom: max(14px, env(safe-area-inset-bottom));
        transform: translateX(-50%) translateY(8px);
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        padding: 8px;
        max-width: 96%;
        background: rgba(22, 24, 28, .82);
        border: 1px solid rgba(255, 255, 255, .14);
        border-radius: 30px;
        opacity: 0;
        pointer-events: none;
        transition: opacity .35s ease, transform .35s ease;
        z-index: 10;
      }
      .controls.show {
        opacity: 1;
        pointer-events: auto;
        transform: translateX(-50%) translateY(0);
      }
      .controls button {
        appearance: none;
        border: 1px solid rgba(255, 255, 255, .16);
        background: rgba(255, 255, 255, .07);
        color: #f2f4f5;
        font: inherit;
        font-size: .92rem;
        line-height: 1;
        padding: 0 16px;
        border-radius: 999px;
        cursor: pointer;
        white-space: nowrap;
      }
      .controls button:active { background: rgba(255, 255, 255, .18); }
      .controls button[aria-pressed="true"] {
        background: #ff9a2e;
        border-color: #ff9a2e;
        color: #1a1206;
        font-weight: 700;
      }

      /* 最初だけ出るヒント */
      .hint {
        position: fixed;
        left: 50%;
        top: max(16px, env(safe-area-inset-top));
        transform: translateX(-50%);
        font-size: .9rem;
        letter-spacing: .04em;
        color: rgba(255, 255, 255, .66);
        background: rgba(20, 22, 26, .55);
        padding: 8px 16px;
        border-radius: 999px;
        pointer-events: none;
        transition: opacity 1s ease;
        white-space: nowrap;
        z-index: 9;
      }
      .hint.gone { opacity: 0; }

      @media (prefers-reduced-motion: reduce) {
        .rotator { transition: none; }
        .face { transition: none; }
        .face.bounce { animation: none; }
        .face.asleep .eye { animation: none; }
        .zzz { animation-duration: .1s; }
      }
    </style>
  </head>
  <body>
    <div class="rotator" id="rotator" data-rot="0">
    <main class="stage" id="stage" aria-label="ロボットの目。タップすると反応します">
      <div class="face" id="face" data-color="white" data-expr="normal">
        <div class="eye left">
          <span class="heart" aria-hidden="true">
            <svg viewBox="0 0 100 92"><path d="M50 84C20 62 6 44 6 27 6 12 17 3 29 3c9 0 17 5 21 12C54 8 62 3 71 3c12 0 23 9 23 24 0 17-14 35-44 57z"/></svg>
          </span>
        </div>
        <div class="eye right">
          <span class="heart" aria-hidden="true">
            <svg viewBox="0 0 100 92"><path d="M50 84C20 62 6 44 6 27 6 12 17 3 29 3c9 0 17 5 21 12C54 8 62 3 71 3c12 0 23 9 23 24 0 17-14 35-44 57z"/></svg>
          </span>
        </div>
      </div>
    </main>

    <p class="hint" id="hint">タップで反応 ・ 横置きは「画面を90°回転」</p>

    <nav class="controls" id="controls" aria-label="目の設定">
      <button type="button" id="btnExpr">表情：ふつう</button>
      <button type="button" id="btnColor">色：しろ</button>
      <button type="button" id="btnSound" aria-pressed="false">音：オフ</button>
      <button type="button" id="btnWake" aria-pressed="false">画面つけっぱなし</button>
      <button type="button" id="btnFull">全画面</button>
      <button type="button" id="btnRot">画面を90°回転</button>
    </nav>
    </div>

    <script>
      (function () {
        var stage = document.getElementById('stage');
        var face = document.getElementById('face');
        var rotator = document.getElementById('rotator');
        var controls = document.getElementById('controls');
        var hint = document.getElementById('hint');
        var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        /* ---------- 状態 ---------- */
        var exprs = [
          { id: 'normal',    label: 'ふつう' },
          { id: 'happy',     label: 'うれしい' },
          { id: 'surprised', label: 'びっくり' },
          { id: 'love',      label: 'らぶ' },
          { id: 'sleepy',    label: 'ねむい' }
        ];
        var colors = [
          { id: 'white',  label: 'しろ' },
          { id: 'sky',    label: 'みずいろ' },
          { id: 'orange', label: 'オレンジ' },
          { id: 'green',  label: 'みどり' },
          { id: 'pink',   label: 'ピンク' }
        ];
        var exprIdx = 0, colorIdx = 0;
        var rotDeg = 0;         // 画面回転（0/90/180/270）
        var sleeping = false;   // 居眠り中
        var soundOn = false;
        var audioCtx = null;

        /* ---------- まばたき ---------- */
        function blinkOnce(wink) {
          if (sleeping) return;
          face.classList.add(wink ? 'wink' : 'blink');
          setTimeout(function () {
            face.classList.remove('blink');
            face.classList.remove('wink');
          }, 130);
        }
        function scheduleBlink() {
          var wait = 2000 + Math.random() * 3600;
          setTimeout(function () {
            var r = Math.random();
            if (r < 0.10) {
              blinkOnce(true);                    // たまにウインク
            } else if (r < 0.28) {
              blinkOnce(false);                   // たまに二度まばたき
              setTimeout(function () { blinkOnce(false); }, 260);
            } else {
              blinkOnce(false);
            }
            scheduleBlink();
          }, wait);
        }
        scheduleBlink();

        /* ---------- キョロキョロ ---------- */
        var gazeSpots = [
          [0, 0], [0, 0], [-4.2, -0.6], [4.2, -0.6], [-3.4, 1.2],
          [3.4, 1.2], [0, -1.8], [0, 1.4], [-5, 0.4], [5, 0.4]
        ];
        function wander() {
          if (!sleeping && !reduceMotion) {
            var s = gazeSpots[Math.floor(Math.random() * gazeSpots.length)];
            face.style.transform = 'translate(' + s[0] + 'vmin,' + s[1] + 'vmin)';
          }
          setTimeout(wander, 2400 + Math.random() * 3200);
        }
        setTimeout(wander, 1600);

        function lookAt(clientX, clientY) {
          // タップ位置を「回転後の画面」の座標系に直してから視線に変える
          var W = window.innerWidth, H = window.innerHeight;
          var dx = clientX - W / 2, dy = clientY - H / 2;
          var rad = -rotDeg * Math.PI / 180;
          var cos = Math.cos(rad), sin = Math.sin(rad);
          var lx = dx * cos - dy * sin;
          var ly = dx * sin + dy * cos;
          var lw = (rotDeg === 90 || rotDeg === 270) ? H : W;
          var lh = (rotDeg === 90 || rotDeg === 270) ? W : H;
          var gx = (lx / lw) * 11;
          var gy = (ly / lh) * 5;
          face.style.transform = 'translate(' + gx.toFixed(1) + 'vmin,' + gy.toFixed(1) + 'vmin)';
        }

        /* ---------- 音（ピッという電子音） ---------- */
        function blip(freq) {
          if (!soundOn) return;
          try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            var t = audioCtx.currentTime;
            var osc = audioCtx.createOscillator();
            var gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(freq || 740, t);
            osc.frequency.exponentialRampToValueAtTime((freq || 740) * 1.6, t + 0.09);
            gain.gain.setValueAtTime(0.045, t);
            gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(t); osc.stop(t + 0.15);
          } catch (e) { /* 音が出ない環境では黙る */ }
        }

        /* ---------- 居眠り ---------- */
        var idleTimer = null, zTimer = null;
        function spawnZ() {
          if (!sleeping) return;
          var z = document.createElement('span');
          z.className = 'zzz';
          z.textContent = Math.random() < 0.5 ? 'Z' : 'z';
          var r = face.getBoundingClientRect();
          z.style.left = (r.right - r.width * 0.18) + 'px';
          z.style.top = (r.top + r.height * 0.08) + 'px';
          z.style.fontSize = (20 + Math.random() * 22) + 'px';
          // Zzzも回転後の「上」へ流れるようにする
          var zVec = { 0: [7, -16], 90: [16, 7], 180: [-7, 16], 270: [-16, -7] };
          var zv = zVec[rotDeg];
          z.style.setProperty('--zx', zv[0] + 'vmin');
          z.style.setProperty('--zy', zv[1] + 'vmin');
          z.style.setProperty('--zr', rotDeg + 'deg');
          document.body.appendChild(z);
          setTimeout(function () { z.remove(); }, 3500);
        }
        function goSleepy() {
          face.classList.add('drowsy');
          setTimeout(function () {
            if (face.classList.contains('drowsy')) {
              face.classList.add('asleep');
              sleeping = true;
              face.style.transform = 'translate(0, 0.8vmin)';
              spawnZ();
              zTimer = setInterval(spawnZ, 2600);
            }
          }, 5000);
        }
        function wakeUp() {
          if (!sleeping && !face.classList.contains('drowsy')) return;
          sleeping = false;
          face.classList.remove('drowsy');
          face.classList.remove('asleep');
          if (zTimer) { clearInterval(zTimer); zTimer = null; }
          // 目覚めはびっくり顔で
          var prev = face.dataset.expr;
          face.dataset.expr = 'surprised';
          blip(980);
          setTimeout(function () { face.dataset.expr = prev; }, 700);
        }
        function resetIdle() {
          if (idleTimer) clearTimeout(idleTimer);
          idleTimer = setTimeout(goSleepy, 45000);  // 45秒放っておくと居眠り
        }
        resetIdle();

        /* ---------- タップ反応 ---------- */
        var controlsTimer = null;
        function showControls() {
          controls.classList.add('show');
          hint.classList.add('gone');
          if (controlsTimer) clearTimeout(controlsTimer);
          controlsTimer = setTimeout(function () {
            controls.classList.remove('show');
          }, 4000);
        }
        setTimeout(showControls, 600);          // 最初に一度だけ操作を見せる
        setTimeout(function () { hint.classList.add('gone'); }, 6000);

        stage.addEventListener('pointerdown', function (ev) {
          resetIdle();
          var wasSleeping = sleeping || face.classList.contains('drowsy');
          wakeUp();
          showControls();
          lookAt(ev.clientX, ev.clientY);
          if (!wasSleeping) {
            blinkOnce(false);
            blip(740);
            // ふつう顔のときだけ、タップで一瞬うれしい顔＋小ジャンプ
            if (face.dataset.expr === 'normal' && !reduceMotion) {
              face.dataset.expr = 'happy';
              face.classList.remove('bounce');
              void face.offsetWidth;
              face.classList.add('bounce');
              setTimeout(function () {
                if (exprs[exprIdx].id === 'normal') face.dataset.expr = 'normal';
              }, 650);
            }
          }
        });

        /* キーボードでも起こして操作バーを出せる */
        document.addEventListener('keydown', function () {
          resetIdle();
          wakeUp();
          showControls();
          blinkOnce(false);
        });

        /* ---------- 操作ボタン ---------- */
        var btnExpr = document.getElementById('btnExpr');
        var btnColor = document.getElementById('btnColor');
        var btnSound = document.getElementById('btnSound');
        var btnWake = document.getElementById('btnWake');
        var btnFull = document.getElementById('btnFull');
        var btnRot = document.getElementById('btnRot');

        btnExpr.addEventListener('click', function () {
          exprIdx = (exprIdx + 1) % exprs.length;
          face.dataset.expr = exprs[exprIdx].id;
          btnExpr.textContent = '表情：' + exprs[exprIdx].label;
          blip(880);
          showControls();
          resetIdle();
        });
        btnColor.addEventListener('click', function () {
          colorIdx = (colorIdx + 1) % colors.length;
          face.dataset.color = colors[colorIdx].id;
          btnColor.textContent = '色：' + colors[colorIdx].label;
          blip(880);
          showControls();
          resetIdle();
        });
        btnSound.addEventListener('click', function () {
          soundOn = !soundOn;
          btnSound.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
          btnSound.textContent = soundOn ? '音：オン' : '音：オフ';
          blip(880);
          showControls();
        });

        /* 画面つけっぱなし（Wake Lock） */
        var wakeLock = null;
        function requestWake() {
          if (!('wakeLock' in navigator)) return Promise.resolve(false);
          return navigator.wakeLock.request('screen').then(function (lock) {
            wakeLock = lock;
            lock.addEventListener('release', function () {
              wakeLock = null;
              btnWake.setAttribute('aria-pressed', 'false');
            });
            return true;
          }).catch(function () { return false; });
        }
        btnWake.addEventListener('click', function () {
          if (wakeLock) {
            wakeLock.release();
            wakeLock = null;
            btnWake.setAttribute('aria-pressed', 'false');
          } else {
            requestWake().then(function (ok) {
              btnWake.setAttribute('aria-pressed', ok ? 'true' : 'false');
              if (!ok) btnWake.textContent = '画面つけっぱなし（非対応）';
            });
          }
          showControls();
        });
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible' &&
              btnWake.getAttribute('aria-pressed') === 'true') {
            requestWake();
          }
        });

        /* 全画面 */
        btnFull.addEventListener('click', function () {
          if (document.fullscreenElement) {
            document.exitFullscreen();
          } else if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen().catch(function () {});
          }
          showControls();
        });
        document.addEventListener('fullscreenchange', function () {
          btnFull.textContent = document.fullscreenElement ? '全画面をやめる' : '全画面';
        });

        /* 画面を90°回転（縦固定ビューワーでも横置きに合わせる） */
        btnRot.addEventListener('click', function () {
          rotDeg = (rotDeg + 90) % 360;
          rotator.dataset.rot = String(rotDeg);
          rotator.style.setProperty('--rot', rotDeg + 'deg');
          blip(880);
          showControls();
          resetIdle();
        });
      })();
    </script>
  </body>
</html>
